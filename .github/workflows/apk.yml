name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: |
          mkdir -p www
          cp index.html www/index.html
          cp node_modules/three/build/three.min.js www/three.min.js
          echo '{"appId":"com.roleplay.imperial","appName":"Roleplay Imperial","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
      - run: npx cap add android
      - run: |
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: roleplay-imperial-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
