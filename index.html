const PUXP=2000;
function puxar(){
  if(!started||jail.on)return;
  const own=(BST.own&&BST.own.length>1)||(BST.cars&&BST.cars.length>0);
  if(!rented&&!own){msg('🚛 Você ainda não tem moto ou carro para puxar',1);chatSay('🚛 Compre ou alugue um veículo primeiro','sys');return}
  if(!foot){msg('🚛 Desça do veículo (SAIR) para puxá-lo até você',1);return}
  if(Math.hypot(bx-px,bz-pz)<4&&bike.visible&&rented){msg('🚛 Seu veículo já está aqui',1);return}
  if(inShop){msg('🚛 Não dá para puxar aqui',1);return}
  if(money<PUXP){msg('Saldo insuficiente: R$ '+fmt(PUXP),1);return}
  let q=null;
  for(const r of[4,5,6,8]){for(let a=0;a<12&&!q;a++){const t=a*Math.PI/6,x=px+Math.cos(t)*r,z=pz+Math.sin(t)*r;if(onDrive(x,z))q=[x,z]}if(q)break}
  if(!q){msg('🚛 Não dá para puxar aqui',1);return}
  money-=PUXP;saveG();rented=true;bike.visible=true;bx=q[0];bz=q[1];h=ph;ch=cy;sp=0;
  const vn=VEH.car&&BST.cars&&BST.cars[BST.cs]?BST.cars[BST.cs].n:BK5[BST.sel||0].n;
  msg('🚛 '+vn+' puxado até você! −R$ '+fmt(PUXP),1);chatSay('🚛 Guincho: '+vn+' entregue por R$ '+fmt(PUXP),'sys');
}

  return _ms.apply(this,arguments.length===4?[tag,col,nm,txt]:arguments)};
 /* recebe o ID dos outros */
 var _ar=admRecv;
 admRecv=function(m,d){
  if(m.slice(0,7)==='~~pid~~'){
   var id=+m.slice(7),from=lo(d.n),me=myN();
   if(!(id>=1000&&id<=9999)||!from||from===me)return true;
   if(id===MYID){ if(from<me){var k=0;do{MYID=1000+((MYID-1000+1)%9000)}while(taken(MYID)&&++k<9000);try{chatSay('🆔 Seu ID mudou para #'+MYID+' (ID repetido)','sys')}catch(e){}announce()}else announce(); return true}
   if(taken(id)&&PID[from]!==id)return true;
   PID[from]=id;return true}
  return _ar(m,d)};
 /* manutenção: define meu ID, avisa os outros, atualiza as plaquinhas */
 setInterval(function(){try{
  if(!online){Y=0;return}
  if(!Y&&myName&&myName!=='Você'){Y=1;MYID=hashId(myName);var k=0;while(taken(MYID)&&++k<9000)MYID=1000+((MYID-1000+1)%9000);try{chatSay('🆔 Seu ID: #'+MYID,'sys')}catch(e){}}
 }catch(e){}},300);
 setInterval(announce,20000);
 setInterval(function(){try{
  if(!online)return;
  if(remotes.size>sz)setTimeout(announce,600);
  sz=remotes.size;
  var now=performance.now(),names={};
  for(var e of remotes){
   var id=e[0],r=e[1],l=lo(r.n);names[l]=1;
   if(r.__t0===undefined){r.__t0=now;r.__sh=LAST[l]||0}
   var show=PID[l]||0;
   if(!show&&now-r.__t0>6000){show=+id;FB[l]=show}
   if(show&&show!==r.__sh&&!MSKN[r.n]){
    r.__sh=show;
    if(typeof rmTag==='function'){rmTag(r);var sp=r.g.children.find(function(c){return c.isSprite});if(sp)r.tag=sp}}}
  for(var k in PID)if(!names[k])delete PID[k];
  for(var k2 in FB)if(!names[k2])delete FB[k2];
 }catch(e){}},1000);
 /* comandos: /id NOME_OU_ID  e  /ids */
 var _ci=chatCmd;
 chatCmd=function(t){
  var raw=String(t).trim(),a=raw.split(/\s+/),c=lo(a[0]);
  if(c==='/id'&&a[1]){
   var tok=a[1],nmx=null,idx=null;
   if(/^#?\d+$/.test(tok)){var P=findPerson(tok);if(P){nmx=P.me?(myName||'Você'):P.name;idx=P.id}}
   else if(online){
    var l=lo(tok),hit=[];
    for(var e of remotes){var r=e[1];if(MSKN[r.n])continue;var q=lo(r.n);if(q===l){hit=[e];break}if(q.indexOf(l)===0)hit.push(e)}
    if(hit.length===1){nmx=hit[0][1].n;idx=pidOf(hit[0][0],hit[0][1])}
    else if(hit.length>1){chatSay('🔎 Mais de um jogador com esse começo, escreva o nome completo','sys');return}}
   if(nmx===null){chatSay('❌ Não achei ninguém com "'+tok+'" (só jogadores online)','sys');return}
   chatSay('🆔 '+nmx+' #'+idx,'sys');return}
  if(c==='/ids'){
   if(!online){chatSay('🌐 Só funciona online','sys');return}
   var X=foot?px:bx,Z=foot?pz:bz,L=[];
   for(var e2 of remotes){var r2=e2[1];if(MSKN[r2.n])continue;L.push({n:r2.n,id:pidOf(e2[0],r2),d:Math.hypot(r2.x-X,r2.z-Z)})}
   L.sort(function(u,v){return u.d-v.d});
   chatSay('👥 Online agora: '+(L.length+1)+' (você: '+(myName||'Você')+' #'+(MYID||'—')+')','sys');
   L.slice(0,5).forEach(function(p){chatSay(p.n+' #'+p.id+' · '+Math.round(p.d)+' m','sys')});
   if(L.length>5)chatSay('… e mais '+(L.length-5)+'. Use /id NOME para ver outro','sys');
   return}
  return _ci(t)};
})()}catch(e){console.warn('ver id falhou',e)}
